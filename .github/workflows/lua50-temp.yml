name: Temporary Lua 5.0.3 and XML check

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Outfitter
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore canonical Lua 5.0.3 checker
        shell: bash
        run: |
          set -euo pipefail
          git checkout 987342ba991a9e1eff2935207fc310e5a793997b -- tools/lua50
      - name: Run canonical Lua 5.0.3 compiler check
        shell: bash
        run: |
          set -euo pipefail
          bash tools/lua50/check_lua50.sh \
            Outfitter.lua \
            locales/enUS.lua \
            locales/deDE.lua \
            locales/frFR.lua \
            locales/zhCN.lua \
            locales/zhTW.lua \
            locales/koKR.lua
      - name: Check XML well-formedness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("Outfitter.xml")
          PY
